- name: Creating users "{{ username }}" without admin access
  user:
    name: "{{ username }}"
    password: "{{ upassword | password_hash('sha512') }}"
  when: assigned_role == "no"

- name: Expiring password for user "{{ uusername }}"
  shell: chage -d 0 "{{ uusername }}"
